    .f0{fill:var(--c0)}.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}.f5{fill:var(--c5)}.f6{fill:var(--c6)}.f7{fill:var(--c7)}.fx{fill:var(--cx)}

    ul.legend li{display:inline-flex;align-items:center;gap:6px}svg.key{width:14px;height:10px}svg.key line{stroke-width:2.5}

  <script>

  function h(tag,attrs,kids){const n=document.createElement(tag);if(attrs)for(const k of Object.keys(attrs)){const v=attrs[k];if(v==null||v===false)continue;if(k==="text")n.textContent=v;else if(k==="cls")n.className=v;else n.setAttribute(k,v===true?"":String(v))}if(kids)for(const c of kids){if(c==null)continue;n.appendChild(typeof c==="string"?document.createTextNode(c):c)}return n}

  function objectPage(){

      list.hidden=true;detail.hidden=false;detail.textContent="";renderRecord(r);document.title=r[2][D.k]+" · "+baseTitle;const t=$("#record-title");if(t)t.focus()}
    function section(title,kids){return h("section",{cls:"panel"},[h("h2",{text:title})].concat(kids))}
    function renderRecord(r){const title=r[2][D.k],art=h("article",{cls:"record"});
      art.appendChild(h("p",{},[h("a",{href:"#",text:T.back})]));
      art.appendChild(h("p",{cls:"eyebrow",text:D.singular}));
      art.appendChild(h("h1",{id:"record-title",tabindex:"-1",text:title}));
      if(r[1])art.appendChild(h("p",{},[h("span",{cls:"badge warn",text:fmt(T.inTrash,{when:r[1]})})]));
      const dl=h("dl",{cls:"fields"});D.cols.forEach((c,i)=>{if(c[1]==="h"||c[3])return;const n=cellNode(c[1]==="k"?"t":c[1],r[2][i],r[0],"");dl.appendChild(h("dt",{text:c[0]}));dl.appendChild(n?h("dd",{},[n]):h("dd",{cls:"empty",text:T.empty}))});

      const inc=r[3]||[];const groups=new Map();inc.forEach(p=>{if(!groups.has(p[0]))groups.set(p[0],[]);groups.get(p[0]).push(p[1])});
      const rel=[];Array.from(groups.keys()).sort((a,b)=>a-b).forEach(k=>{const ids=groups.get(k);const ul=h("ul",{cls:"links"});const more=ids.length>50;
        ids.slice(0,50).forEach(i=>{const a=refLink(i);if(a)ul.appendChild(h("li",{},[a]))});
        rel.push(h("h3",{text:fmt(T.relGroup,{label:D.incg[k],count:num(ids.length)})}));rel.push(ul);
        if(more){const b=h("button",{type:"button",text:fmt(T.showAll,{count:num(ids.length)})});b.addEventListener("click",()=>{ids.slice(50).forEach(i=>{const a=refLink(i);if(a)ul.appendChild(h("li",{},[a]))});b.remove()});rel.push(b)}});
      art.appendChild(section(T.related,rel.length?rel:[h("p",{cls:"muted",text:T.none})]));
      const tl=r[4]||[];const ol=h("ol",{cls:"timeline"});tl.slice().reverse().forEach(e=>{const fields=(e[3]||[]).map(i=>typeof i==="number"?D.fl[i]:i).join(", ");
        ol.appendChild(h("li",{},[h("time",{text:e[0]})," ",h("strong",{text:(D.ops||[])[e[2]]||String(e[2])})," · "+((D.actors||[])[e[1]]||""),(e[4]!=null&&e[4]!==""?" · "+((D.origins||[])[e[4]]||""):""),fields?h("div",{cls:"muted small",text:fmt(T.changed,{fields:fields})}):null]))});
      art.appendChild(section(T.timeline,tl.length?[ol]:[h("p",{cls:"muted",text:T.none})]));
      const pages=r[5]||[];art.appendChild(section(T.wiki,pages.length?[h("ul",{cls:"links"},pages.map(i=>h("li",{},[h("a",{href:D.pages[i][0],text:D.pages[i][1]})])))]:[h("p",{cls:"muted",text:T.noWiki})]));
      const sys=h("dl",{cls:"fields"});D.cols.forEach((c,i)=>{if(!c[3])return;const n=cellNode(c[1],r[2][i],r[0],"");sys.appendChild(h("dt",{text:c[0]}));sys.appendChild(n?h("dd",{},[n]):h("dd",{cls:"empty",text:T.empty}))});

      art.appendChild(section(T.system,[sys,h("p",{},[h("a",{href:D.raw+r[0]+".md",text:T.raw})])]));
      detail.appendChild(art)}
    window.addEventListener("hashchange",route);route()}
  function tablePage(){
    const host=$("#groups"),search=$("#search");if(!host)return;const grids=[];
    const sections=[];D.groups.forEach((gr,k)=>{const sec=h("section",{cls:"group"});sections.push(sec);
      if(D.grouped){const btn=h("button",{type:"button","aria-expanded":"true",text:"−"});const body=h("div");
        const label=h("span",{},[gr.c?h("span",{cls:"dot",style:"background:"+gr.c}):null,gr.l]);
        sec.appendChild(h("h2",{},[btn,label,h("span",{cls:"badge",text:num(gr.n)})]));sec.appendChild(body);
        btn.setAttribute("aria-label",fmt(T.toggle,{label:gr.l}));btn.addEventListener("click",()=>{const open=btn.getAttribute("aria-expanded")==="true";btn.setAttribute("aria-expanded",String(!open));btn.textContent=open?"+":"−";body.hidden=open});
        grids.push(grid(body,D.cols,gr.rows,{pageSize:100,footer:gr.a,footerLabel:T.groupTotal,base:D.oh}))}
      else grids.push(grid(sec,D.cols,gr.rows,{pageSize:200,footer:gr.a,footerLabel:T.total,base:D.oh}));
      host.appendChild(sec)});
    let timer=0;if(search)search.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{const q=search.value.trim();grids.forEach((g,k)=>{g.setQuery(q);if(D.grouped)sections[k].hidden=!!q&&g.count()===0})},120)})}
  function calendarPage(){
    const host=$("#calendar");if(!host)return;const byDate=new Map();(D.entries||[]).forEach(e=>{if(!byDate.has(e[0]))byDate.set(e[0],[]);byDate.get(e[0]).push(e)});
    const parse=s=>{const p=s.split("-").map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]))};
    const iso=d=>d.toISOString().slice(0,10);const add=(d,n)=>new Date(d.getTime()+n*86400000);
    const ws=D.ws||1;const offset=d=>((d.getUTCDay()||7)-ws+7)%7;
    let mode=D.mode==="week"?"week":"month",cursor=parse(D.today);
    const title=h("h2",{"aria-live":"polite"}),prev=h("button",{type:"button",text:T.prev}),today=h("button",{type:"button",text:T.today}),next=h("button",{type:"button",text:T.next});
    const mMonth=h("button",{type:"button",text:T.month}),mWeek=h("button",{type:"button",text:T.week}),body=h("div");
    host.appendChild(h("div",{cls:"cal-head"},[title,prev,today,next,mMonth,mWeek]));host.appendChild(body);
    prev.addEventListener("click",()=>{cursor=mode==="month"?new Date(Date.UTC(cursor.getUTCFullYear(),cursor.getUTCMonth()-1,1)):add(cursor,-7);draw()});
    next.addEventListener("click",()=>{cursor=mode==="month"?new Date(Date.UTC(cursor.getUTCFullYear(),cursor.getUTCMonth()+1,1)):add(cursor,7);draw()});
    today.addEventListener("click",()=>{cursor=parse(D.today);draw()});
    mMonth.addEventListener("click",()=>{mode="month";draw()});mWeek.addEventListener("click",()=>{mode="week";draw()});
    function entryNode(e){const a=h("a",{cls:"entry",href:D.oh+"#"+e[2],title:(e[1]?e[1]+" ":"")+e[3]+(e[4]?" · "+e[4]:"")},[e[1]?h("strong",{text:e[1]+" "}):null,e[3]]);return a}
    function draw(){body.textContent="";mMonth.setAttribute("aria-pressed",String(mode==="month"));mWeek.setAttribute("aria-pressed",String(mode==="week"));
      let start,days;if(mode==="month"){const first=new Date(Date.UTC(cursor.getUTCFullYear(),cursor.getUTCMonth(),1));start=add(first,-offset(first));const last=new Date(Date.UTC(cursor.getUTCFullYear(),cursor.getUTCMonth()+1,0));days=Math.ceil((offset(first)+last.getUTCDate())/7)*7;title.textContent=D.months[cursor.getUTCMonth()]+" "+cursor.getUTCFullYear()}
      else{start=add(cursor,-offset(cursor));days=7;const end=add(start,6);title.textContent=fmt(T.weekRange,{from:fmtDay(start),to:fmtDay(end)})}
      const table=h("table",{cls:"cal"+(mode==="week"?" week":"")}),tr0=h("tr");for(let i=0;i<7;i++)tr0.appendChild(h("th",{scope:"col",text:D.days[(ws-1+i)%7]}));table.appendChild(h("thead",{},[tr0]));
      const tb=h("tbody");let tr=null;
      for(let i=0;i<days;i++){if(i%7===0){tr=h("tr");tb.appendChild(tr)}const d=add(start,i),key=iso(d),list=byDate.get(key)||[];
        const td=h("td",{cls:[mode==="month"&&d.getUTCMonth()!==cursor.getUTCMonth()?"out":"",key===D.today?"today":""].join(" ").trim()||null});
        td.appendChild(h("div",{cls:"daynum",text:mode==="week"?fmtDay(d):String(d.getUTCDate())}));
        const limit=mode==="month"?4:1000;list.slice(0,limit).forEach(e=>td.appendChild(entryNode(e)));
        if(list.length>limit){const b=h("button",{type:"button",cls:"small",text:fmt(T.more,{count:num(list.length-limit)})});b.addEventListener("click",()=>{list.slice(limit).forEach(e=>td.insertBefore(entryNode(e),b));b.remove()});td.appendChild(b)}
        tr.appendChild(td)}
      table.appendChild(tb);body.appendChild(h("div",{cls:"table-scroll"},[table]))}
    function fmtDay(d){return D.lang==="de"?d.getUTCDate()+". "+D.monthsShort[d.getUTCMonth()]:D.monthsShort[d.getUTCMonth()]+" "+d.getUTCDate()}
    draw()}
  if(D.page==="object")objectPage();else if(D.page==="table")tablePage();else if(D.page==="calendar")calendarPage();
  })();
